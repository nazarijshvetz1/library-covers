name: Import base64 library covers

on:
  push:
    paths:
      - 'imports/*.jpg.b64'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decode cover files
        run: |
          mkdir -p covers
          shopt -s nullglob
          files=(imports/*.jpg.b64)
          test ${#files[@]} -gt 0
          for encoded in "${files[@]}"; do
            name="$(basename "$encoded" .b64)"
            base64 --decode "$encoded" > "covers/$name"
          done
          rm -f imports/*.jpg.b64

      - name: Commit imported covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add covers imports
          git diff --cached --quiet || git commit -m "Import missing library cover"
          git push
