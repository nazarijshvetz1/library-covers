name: Unpack library covers

on:
  push:
    paths:
      - covers.zip

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack cover images
        run: |
          rm -rf covers
          mkdir -p covers
          unzip -o covers.zip -d covers
          find covers -type f -name '*.jpg' -print

      - name: Commit extracted covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add covers
          git diff --cached --quiet || git commit -m "Unpack library cover images"
          git push
