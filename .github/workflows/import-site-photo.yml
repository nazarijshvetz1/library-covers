name: Import site cover photo

on:
  push:
    branches:
      - main
    paths:
      - 'imports/site/*.jpg.b64'

permissions:
  contents: read

concurrency:
  group: library-cover-repository-writes
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install image dependencies
        run: python -m pip install --requirement scripts/requirements.txt

      - name: Validate and import pending site photos
        id: import_photos
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(imports/site/*.jpg.b64)
          if (( ${#files[@]} == 0 )); then
            echo "No pending site-photo imports."
            exit 0
          fi

          outcome=0
          for encoded in "${files[@]}"; do
            python scripts/import_site_photo.py --repo-root . --input "$encoded" || outcome=1
          done
          exit "$outcome"

      - name: Commit cover, request status, and consumed import
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- covers cover-status/requests imports/site
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Process site cover photo"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Report an unrecorded processing failure
        if: steps.import_photos.outcome == 'failure'
        run: exit 1
