name: Optimize library covers

on:
  push:
    paths:
      - .github/workflows/optimize-covers.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Optimize JPEG covers
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          for path in sorted(Path('covers').glob('CAT-*.jpg')):
              with Image.open(path) as source:
                  image = ImageOps.exif_transpose(source).convert('RGB')
                  image.thumbnail((600, 900), Image.Resampling.LANCZOS)
                  image.save(path, 'JPEG', quality=82, optimize=True, progressive=True)
          PY

      - name: Commit optimized covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add covers
          git diff --cached --quiet || git commit -m "Optimize library cover images"
          git push
